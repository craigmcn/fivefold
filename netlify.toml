[build]
  command = "yarn build:netlify"
  publish = "netlify"

# CSP lists only directives that differ from default-src 'self'. index.html's
# inline script must run before the bundle loads, so it's allowed by hash;
# src/securityHeaders.test.ts fails if the script and hash drift apart.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-T/kHboZeuJu8evdBg7F5L6IJwXk4K4yT6wx+pba/vC4='; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
